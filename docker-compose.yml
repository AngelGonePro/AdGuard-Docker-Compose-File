services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped

    # --- Resource ceiling for a 1vCPU / 1GB host ---
    # Leaves headroom for the OS + any other containers (e.g. Technitium)
    # sharing the box. AdGuard's own footprint is normally 30-80MB, but
    # query logging/stats can grow if unbounded — see config notes below.
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          memory: 64M

    # --- Networking ---
    # If Technitium (or anything else) already owns :53 on this host,
    # change the host-side port here (e.g. "127.0.0.1:5353:53/udp") and
    # only expose 53 for whichever resolver is authoritative.
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"   # initial setup wizard (can disable/firewall after setup)
      - "80:80/tcp"       # optional: web UI over plain HTTP after setup
      # - "443:443/tcp"   # uncomment if you terminate TLS at AdGuard directly
      # - "853:853/tcp"   # uncomment for DNS-over-TLS
      # - "784:784/udp"   # uncomment for DNS-over-QUIC

    volumes:
      - ./workdir:/opt/adguardhome/work
      - ./confdir:/opt/adguardhome/conf

    # --- Prevent disk exhaustion from logs on a small VPS ---
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Nice-to-have: keeps AdGuard's own resolver behavior deterministic
    # rather than depending on the host's /etc/resolv.conf chain.
    dns:
      - 127.0.0.1
      - 1.1.1.2
